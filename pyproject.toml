[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microhistory"
version = "0.1.0"
description = "Faceless YouTube channel production pipeline for MicroHistory episodes"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.5,<3",
    "rich>=13.7,<14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=4.1,<6",
]

[project.scripts]
microhistory = "microhistory.main:cli"

[tool.setuptools.packages.find]
include = ["microhistory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
